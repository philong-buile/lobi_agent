<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Lobi: your own AI agent on Telegram, running Claude Code on your machine">
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; }
  </style>
  <rect x="64" y="66" width="56" height="56" rx="14" fill="none" stroke="#5aa9de" stroke-width="4"/>
  <path d="M101 80 L83 108" stroke="#5aa9de" stroke-width="5" stroke-linecap="round"/>
  <text x="140" y="114" class="sans" font-size="64" font-weight="700" letter-spacing="-2" fill="#f4f4f5">Lobi</text>
  <text x="64" y="190" class="sans" font-size="26" fill="#a1a1aa">Your own AI agent on Telegram,</text>
  <text x="64" y="226" class="sans" font-size="26" fill="#a1a1aa">running Claude Code on your machine.</text>
  <g class="mono" font-size="17" fill="#a1a1aa">
    <text x="760" y="88"><tspan fill="#5aa9de">./setup.ps1</tspan></text>
    <text x="760" y="128"><tspan fill="#5aa9de">openclaw</tspan> gateway status</text>
    <text x="760" y="168"><tspan fill="#5aa9de">openclaw</tspan> pairing approve telegram &lt;CODE&gt;</text>
    <text x="760" y="208"><tspan fill="#5aa9de">openclaw</tspan> logs --follow</text>
    <text x="760" y="248"><tspan fill="#5aa9de">openclaw</tspan> doctor --fix</text>
  </g>
</svg>
